<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Cập nhật Banner - Y Tế Mart</title>
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <style>
        .preview-img { max-width: 300px; max-height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body class="sb-nav-fixed">
    <div id="header"></div>
    <div id="layoutSidenav">
        <div id="sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Cập nhật Banner</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin/dashboard/show.html">Trang chủ</a></li>
                        <li class="breadcrumb-item"><a href="/admin/banner/show.html">Banner</a></li>
                        <li class="breadcrumb-item active">Cập nhật</li>
                    </ol>
                    <div class="card mb-4">
                        <div class="card-header"><i class="fas fa-edit me-1"></i> Cập nhật Banner</div>
                        <div class="card-body">
                            <form id="bannerForm" enctype="multipart/form-data">
                                <input type="hidden" id="bannerId" />
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Tiêu đề <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="title" name="title" required />
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Loại banner</label>
                                        <select class="form-select" id="type" name="type">
                                            <option value="main">Banner chính (Main)</option>
                                            <option value="side">Banner bên (Side)</option>
                                            <option value="popup">Popup</option>
                                            <option value="promo">Khuyến mãi</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Hình ảnh</label>
                                        <input type="file" class="form-control" id="image" name="image" accept="image/*" />
                                        <img id="imagePreview" class="preview-img" />
                                        <small class="text-muted d-block mt-1">Để trống nếu không muốn thay đổi</small>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Link (khi click)</label>
                                        <input type="text" class="form-control" id="link" name="link" placeholder="/products?category=sale" />
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Vị trí hiển thị</label>
                                        <input type="number" class="form-control" id="position" name="position" value="0" min="0" />
                                        <small class="text-muted">Số nhỏ hiển thị trước</small>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Ngày bắt đầu</label>
                                        <input type="datetime-local" class="form-control" id="startDate" name="startDate" />
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Ngày kết thúc</label>
                                        <input type="datetime-local" class="form-control" id="endDate" name="endDate" />
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mô tả</label>
                                    <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" name="isActive" />
                                    <label class="form-check-label" for="isActive">Kích hoạt</label>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i> Cập nhật
                                </button>
                                <a href="/admin/banner/show.html" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i> Quay lại
                                </a>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
            <div id="footer"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/js/scripts.js"></script>
    <script src="/assets/js/admin-layout.js"></script>
    <script src="/assets/js/banner.js"></script>
</body>
</html>
